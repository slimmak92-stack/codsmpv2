name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x86)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/moonloader/lib
          cp build/Release/customskins_core.dll dist/moonloader/lib/
          cp moonloader/customskins.lua dist/moonloader/
          mkdir -p dist/custom_models

      - uses: actions/upload-artifact@v4
        with:
          name: CustomSkins
          path: dist/
